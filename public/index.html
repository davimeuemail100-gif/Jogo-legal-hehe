<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Stick e Seus Amigos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="stage">
    <canvas id="game" width="320" height="180" aria-label="Stick e Seus Amigos"></canvas>
  </main>

  <div id="touch" aria-hidden="true">
    <div class="pad">
      <button data-key="TouchLeft">◀</button>
      <button data-key="TouchRight">▶</button>
    </div>
    <div class="pad">
      <button data-key="TouchInteract">E</button>
      <button data-key="TouchJump" class="jump">▲</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="sprites.js"></script>
  <script src="audio.js"></script>
  <script src="messages.js"></script>
  <script src="levels.js"></script>
  <script src="world.js"></script>
  <script src="game.js"></script>
  <script src="mp.js"></script>
</body>
</html>
