<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DIAGNÓSTICO</title>
<style>
body{background:#111;color:#eee;font-family:monospace;padding:20px;font-size:13px}
h1{color:#b8ff2e;font-size:16px}
.ok{color:#4ac24a}.bad{color:#ff4060}.warn{color:#ffd84a}
.row{padding:6px;margin:4px 0;background:#1a1a24;border-radius:6px}
small{color:#888}
</style></head><body>
<h1>DIAGNÓSTICO WRICK</h1>
<div id="out">verificando...</div>
<hr style="border-color:#333;margin:20px 0">
<div id="jsout"></div>
<script>
const arquivos = [
  'index.html','style.css','config.js','sprites.js','audio.js',
  'messages.js','levels.js','world.js','game.js','mp.js','studio.html'
];
const out = document.getElementById('out');
const jsout = document.getElementById('jsout');
let faltando = 0;

(async () => {
  for (const f of arquivos) {
    const r = await fetch('/' + f, { method: 'HEAD' }).catch(() => ({ ok:false, status:'ERRO' }));
    const cls = r.ok ? 'ok' : 'bad';
    const txt = r.ok ? 'OK' : 'FALTOU (' + r.status + ')';
    out.innerHTML += `<div class="row ${cls}">${f} — ${txt}</div>`;
    if (!r.ok) faltando++;
  }
  if (faltando === 0) {
    out.innerHTML += `<div class="row ok" style="margin-top:10px"><b>✔ todos os arquivos no lugar</b></div>`;
  } else {
    out.innerHTML += `<div class="row bad" style="margin-top:10px"><b>✘ faltam ${faltando} arquivos</b> — sobe pro GitHub</div>`;
  }

  // testa se o jogo carrega
  jsout.innerHTML = '<h1>TESTANDO O JOGO</h1>';
  const g = document.createElement('script');
  g.src = '/game.js';
  g.onload = () => {
    setTimeout(() => {
      if (window.StickDebug) {
        jsout.innerHTML += `<div class="row ok">✔ game.js carregou — StickDebug existe</div>`;
        jsout.innerHTML += `<div class="row ok">✔ canvas: ${document.getElementById('game') ? 'existe' : 'NÃO EXISTE'}</div>`;
      } else {
        jsout.innerHTML += `<div class="row bad">✘ game.js carregou mas NÃO criou StickDebug</div>`;
        jsout.innerHTML += `<div class="row warn">abre o console (F12) e vê o erro vermelho</div>`;
      }
    }, 500);
  };
  g.onerror = () => {
    jsout.innerHTML += `<div class="row bad">✘ game.js NÃO carregou (erro de sintaxe ou arquivo faltando)</div>`;
  };
  document.body.appendChild(g);
})();
</script>
</body></html>
